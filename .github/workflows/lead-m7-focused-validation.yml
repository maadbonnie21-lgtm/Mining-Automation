name: Lead M7 focused validation

on:
  push:
    branches: [chatgpt/lead-m7-focused-validation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m7-mining-slice-endurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact M7 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f43ea7c12b8166f41c27cede64bb1edcfd1d1150"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check tests/test_mining_slice.py tests/test_mining_slice_endurance.py src/mining_automation/mining_slice.py
      - name: Strict mypy
        run: mypy --strict --platform linux src/mining_automation/mining_slice.py
      - name: Focused mining runtime and M7 endurance
        run: python -m pytest -q tests/test_mining_slice.py tests/test_mining_slice_endurance.py
