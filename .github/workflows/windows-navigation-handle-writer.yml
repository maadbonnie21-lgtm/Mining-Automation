name: Windows navigation handle writer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  b4-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/b4-navigation-writer-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/b4-navigation-writer-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply deterministic B2/B3 compatibility patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/mining_automation/navigation/durable_route_evidence.py')
          text = p.read_text(encoding='utf-8')
          if 'class _VerifiedDurableRouteEvidence:' not in text:
              text = text.replace('from dataclasses import dataclass, field', 'from dataclasses import InitVar, dataclass, field', 1)
              anchor = '''@dataclass(frozen=True, slots=True)\nclass _AcquisitionFilesystemIdentity:\n    root_identity: tuple[int, ...]\n    tree_identity: tuple[tuple[str, bool, tuple[int, ...]], ...]\n'''
              addition = '''\n\n_DETAIL_FACTORY_TOKEN: Final[object] = object()\n\n\n@dataclass(frozen=True, slots=True)\nclass _ReviewFilesystemIdentity:\n    root_identity: tuple[int, ...]\n    tree_identity: tuple[tuple[str, bool, tuple[int, ...]], ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass _VerifiedDurableRouteEvidence:\n    package: FinalizedRouteEvidencePackage\n    review: RouteEvidenceReview\n    report: RouteEvidenceVerificationReport\n    expectation: DurableRouteEvidenceFilesystemExpectation\n    acquisition_filesystem_identity: _AcquisitionFilesystemIdentity\n    review_filesystem_identity: _ReviewFilesystemIdentity\n    activation_allowed: Literal[False] = field(default=False, init=False)\n    input_authority: Literal[False] = field(default=False, init=False)\n    _factory_token: InitVar[object | None] = None\n\n    def __post_init__(self, _factory_token: object | None) -> None:\n        if _factory_token is not _DETAIL_FACTORY_TOKEN:\n            raise ValueError(\"verified durable route evidence requires its strict loader\")\n        if type(self.package) is not FinalizedRouteEvidencePackage:\n            raise ValueError(\"verified durable route evidence requires an exact package\")\n        if type(self.review) is not RouteEvidenceReview:\n            raise ValueError(\"verified durable route evidence requires an exact review\")\n        if type(self.report) is not RouteEvidenceVerificationReport:\n            raise ValueError(\"verified durable route evidence requires an exact report\")\n        if type(self.expectation) is not DurableRouteEvidenceFilesystemExpectation:\n            raise ValueError(\"verified durable route evidence requires exact caller pins\")\n        if type(self.acquisition_filesystem_identity) is not _AcquisitionFilesystemIdentity:\n            raise ValueError(\"verified durable route evidence lacks acquisition identity\")\n        if type(self.review_filesystem_identity) is not _ReviewFilesystemIdentity:\n            raise ValueError(\"verified durable route evidence lacks review identity\")\n        if self.activation_allowed is not False or self.input_authority is not False:\n            raise ValueError(\"verified durable route evidence cannot carry authority\")\n'''
              if anchor not in text:
                  raise SystemExit('missing acquisition identity anchor')
              text = text.replace(anchor, anchor + addition, 1)
              for func_name, expected_type, msg in (
                  ('_snapshot_acquisition_expectation', 'DurableAcquisitionFilesystemExpectation', 'durable acquisition expectation carries mutated authority fields'),
                  ('_snapshot_full_expectation', 'DurableRouteEvidenceFilesystemExpectation', 'durable route expectation carries mutated authority fields'),
              ):
                  marker = f'''def {func_name}(\n    value: {expected_type},\n) -> {expected_type}:\n    if type(value) is not {expected_type}:\n        raise TypeError(\"expectation must be {expected_type}\")\n'''
                  if marker not in text:
                      raise SystemExit(f'missing {func_name} anchor')
                  guard = f'''    if (\n        value.evidence_role != SYNTHETIC_ROUTE_EVIDENCE_ROLE\n        or value.activation_allowed is not False\n        or value.input_authority is not False\n    ):\n        raise ValueError(\"{msg}\")\n'''
                  text = text.replace(marker, marker + guard, 1)
              review_identity = '''\n\ndef _review_filesystem_identity(\n    root_signature: tuple[int, ...],\n    tree: Mapping[str, _TreeEntry],\n) -> _ReviewFilesystemIdentity:\n    return _ReviewFilesystemIdentity(\n        root_identity=_directory_signature_identity(root_signature),\n        tree_identity=tuple(\n            (relative, entry.is_directory, (_directory_signature_identity(entry.signature) if entry.is_directory else entry.signature))\n            for relative, entry in sorted(tree.items())\n        ),\n    )\n'''
              text = text.replace('\n\ndef load_durable_acquisition(\n', review_identity + '\n\ndef load_durable_acquisition(\n', 1)
              public_header = '''def load_and_verify_durable_synthetic_route_evidence(\n    acquisition_root: str | os.PathLike[str],\n    review_root: str | os.PathLike[str],\n    expectation: DurableRouteEvidenceFilesystemExpectation,\n) -> RouteEvidenceVerificationReport:\n    \"\"\"Verify exact separate roots without granting release or input authority.\"\"\"\n'''
              detailed_header = '''def _load_and_verify_durable_synthetic_route_evidence_detailed(\n    acquisition_root: str | os.PathLike[str],\n    review_root: str | os.PathLike[str],\n    expectation: DurableRouteEvidenceFilesystemExpectation,\n) -> _VerifiedDurableRouteEvidence:\n    \"\"\"Verify exact roots and retain detached detail for deny-only binding.\"\"\"\n'''
              if public_header not in text:
                  raise SystemExit('missing public loader anchor')
              text = text.replace(public_header, detailed_header, 1)
              final = '    return report\n'
              pos = text.rfind(final)
              if pos < 0:
                  raise SystemExit('missing final report return')
              replacement = '''    return _VerifiedDurableRouteEvidence(\n        package=package,\n        review=review,\n        report=report,\n        expectation=owned_expectation,\n        acquisition_filesystem_identity=acquisition.filesystem_identity,\n        review_filesystem_identity=_review_filesystem_identity(root_signature, initial_tree),\n        _factory_token=_DETAIL_FACTORY_TOKEN,\n    )\n\n\ndef load_and_verify_durable_synthetic_route_evidence(\n    acquisition_root: str | os.PathLike[str],\n    review_root: str | os.PathLike[str],\n    expectation: DurableRouteEvidenceFilesystemExpectation,\n) -> RouteEvidenceVerificationReport:\n    \"\"\"Verify exact separate roots without granting release or input authority.\"\"\"\n    return _load_and_verify_durable_synthetic_route_evidence_detailed(\n        acquisition_root, review_root, expectation\n    ).report\n'''
              text = text[:pos] + replacement + text[pos + len(final):]
              p.write_text(text, encoding='utf-8')

          t = Path('tests/test_navigation_release_decision.py')
          tests = t.read_text(encoding='utf-8')
          pin = '        independent_review_sha256=review.independent_review_sha256,\n'
          if 'expected_acquisition_physical_identity_sha256=acquisition.physical_identity_sha256' not in tests:
              if pin not in tests:
                  raise SystemExit('missing release expectation pin anchor')
              tests = tests.replace(
                  pin,
                  '        expected_acquisition_physical_identity_sha256=acquisition.physical_identity_sha256,\n'
                  '        expected_review_physical_identity_sha256=review.physical_identity_sha256,\n'
                  + pin,
                  1,
              )
              t.write_text(tests, encoding='utf-8')
      - name: Ruff
        run: ruff check src/mining_automation/navigation tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
      - name: Strict mypy
        run: mypy --strict src/mining_automation/navigation
      - name: Focused durable and release tests
        run: python -m pytest -q tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mining_automation/navigation/durable_route_evidence.py tests/test_navigation_release_decision.py
          git commit -m 'fix(navigation): preserve B2 release on B3 physical identity'
          git push origin HEAD:chatgpt/b4-navigation-writer-integration

  native-handle-writer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/mining_automation/navigation/_windows_handle_anchored.py src/mining_automation/navigation/handle_anchored_route_evidence.py src/mining_automation/navigation/durable_route_evidence.py tests/test_navigation_durable_route_evidence.py
      - name: Strict mypy
        run: mypy --strict src/mining_automation/navigation/_windows_handle_anchored.py src/mining_automation/navigation/handle_anchored_route_evidence.py src/mining_automation/navigation/durable_route_evidence.py
      - name: Native adversarial matrix
        run: python -m pytest -q tests/test_navigation_durable_route_evidence.py
