name: Windows navigation handle writer

on:
  pull_request:
    paths:
      - "src/mining_automation/navigation/_windows_handle_anchored.py"
      - "src/mining_automation/navigation/handle_anchored_route_evidence.py"
      - "src/mining_automation/navigation/durable_route_evidence.py"
      - "src/mining_automation/navigation/route_evidence_loader.py"
      - "tests/test_navigation_durable_route_evidence.py"
      - "pyproject.toml"
      - ".github/workflows/windows-navigation-handle-writer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-handle-writer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: >-
          ruff check
          src/mining_automation/navigation/_windows_handle_anchored.py
          src/mining_automation/navigation/handle_anchored_route_evidence.py
          src/mining_automation/navigation/durable_route_evidence.py
          tests/test_navigation_durable_route_evidence.py
      - name: Strict mypy
        run: >-
          mypy --strict
          src/mining_automation/navigation/_windows_handle_anchored.py
          src/mining_automation/navigation/handle_anchored_route_evidence.py
          src/mining_automation/navigation/durable_route_evidence.py
      - name: Native adversarial matrix
        run: >-
          python -m pytest -q
          tests/test_navigation_durable_route_evidence.py
