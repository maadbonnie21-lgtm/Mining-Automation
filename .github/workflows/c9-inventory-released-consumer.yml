name: C9 Inventory released consumer

on:
  push:
    branches:
      - chatgpt/c9-inventory-released-consumer

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c9-inventory-released-consumer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed C9 implementation
        shell: python
        run: |
          import base64
          import zlib
          from pathlib import Path

          files = {
              "src/mining_automation/perception/inventory/released_consumer.py": "",
              "src/mining_automation/perception/inventory/__init__.py": "",
              "tests/test_inventory_released_consumer.py": "",
          }
          for path, payload in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(zlib.decompress(base64.b64decode(payload)))
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Strict mypy
        run: mypy --strict --platform linux src
      - name: Focused C9 tests
        run: >-
          python -m pytest -q
          tests/test_inventory_released_consumer.py
          tests/test_inventory_v3_same_frame_consumer_preparation.py
          tests/test_inventory_v3_release_fault_endurance.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Commit validated C9
        shell: bash
        run: |
          rm -f .github/workflows/c9-inventory-released-consumer.yml
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(inventory): add fail-closed released observation consumer'
          git push origin HEAD:chatgpt/c9-inventory-released-consumer
