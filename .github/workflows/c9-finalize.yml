name: C9 finalizer

on:
  push:
    branches:
      - chatgpt/c9-inventory-released-consumer

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c9-inventory-released-consumer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Materialize original C9 payload
        shell: python
        run: |
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "b9c383eef2a77590ca977f4625c95e390d071901:.github/workflows/c9-inventory-released-consumer.yml",
              ],
              text=True,
          )
          lines = source.splitlines()
          step_index = lines.index(
              "      - name: Materialize reviewed C9 implementation"
          )
          run_index = lines.index("        run: |", step_index)
          script_lines: list[str] = []
          for line in lines[run_index + 1 :]:
              if line.startswith("      - name:"):
                  break
              if line == "":
                  script_lines.append("")
                  continue
              if not line.startswith("          "):
                  raise SystemExit(f"unexpected C9 payload indentation: {line!r}")
              script_lines.append(line[10:])
          exec(compile("\n".join(script_lines), "c9-payload", "exec"), {})
      - name: Canonicalize generated import order
        run: ruff check src/mining_automation/perception/inventory/__init__.py --fix
      - name: Ruff
        run: ruff check .
      - name: Strict mypy
        run: mypy --strict --platform linux src
      - name: Focused C9 tests
        run: >-
          python -m pytest -q
          tests/test_inventory_released_consumer.py
          tests/test_inventory_v3_same_frame_consumer_preparation.py
          tests/test_inventory_v3_release_fault_endurance.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Commit validated C9
        shell: bash
        run: |
          rm -f .github/workflows/c9-inventory-released-consumer.yml .github/workflows/c9-finalize.yml
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(inventory): add fail-closed released observation consumer'
          git push origin HEAD:chatgpt/c9-inventory-released-consumer
