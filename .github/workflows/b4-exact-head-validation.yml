name: B4 exact-head validation

on:
  push:
    branches:
      - chatgpt/b4-exact-head-validation

permissions:
  contents: read

env:
  TARGET_SHA: 2458a2852f2bdc78fcedba624b022297ef6bcc04
  B2_SHA: a19b02f090be5165db2baee8b178b19efc4153f5
  B3_SHA: e5d9f3005402070ca0fa8221611dac58580d6d59

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2458a2852f2bdc78fcedba624b022297ef6bcc04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head and both accepted histories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$B2_SHA" "$TARGET_SHA"
          git merge-base --is-ancestor "$B3_SHA" "$TARGET_SHA"
          test "$(git show -s --format=%P 52c341dc4240388f22600fdec8f92976ee638345 | wc -w)" -eq 2
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Strict Linux mypy
        run: mypy --strict --platform linux src
      - name: Focused durable and release tests
        run: python -m pytest -q tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
      - name: All navigation tests
        run: python -m pytest -q tests/test_navigation*.py
      - name: Full repository pytest
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2458a2852f2bdc78fcedba624b022297ef6bcc04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw 'wrong B4 head' }
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/mining_automation/navigation tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
      - name: Strict Windows writer mypy
        run: mypy --strict --platform win32 src/mining_automation/navigation/_windows_handle_anchored.py src/mining_automation/navigation/handle_anchored_route_evidence.py src/mining_automation/navigation/durable_route_evidence.py
      - name: Native adversarial matrix
        run: python -m pytest -q tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
