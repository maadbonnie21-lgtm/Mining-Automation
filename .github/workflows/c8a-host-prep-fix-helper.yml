name: C8A host prep validation helper

on:
  push:
    branches:
      - chatgpt/c8a-host-prep-fix-helper

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c8a-inventory-live-authorization
          path: frozen-c8a
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c8a-windows-authorization-proposal-prep
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact frozen L2 and exact proposal-prep head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-c8a rev-parse HEAD)" = "66c7e9536539979bc60e17f02f026eb64ebf0768"
          test -z "$(git -C frozen-c8a status --porcelain=v1 --untracked-files=all)"
          test "$(git -C target rev-parse HEAD)" = "4fd677e85b940440f8185ffe8fea7fff18454997"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"
      - name: Install
        working-directory: target
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        working-directory: target
        run: ruff check .
      - name: Strict Linux mypy
        working-directory: target
        run: mypy --strict --platform linux src
      - name: Focused C8A host prep and protocol tests
        working-directory: target
        run: >-
          python -m pytest -q
          tests/test_inventory_v3_protocol_v2_authorization_host_prep.py
          tests/test_inventory_v3_protocol_v2_protocol.py
          tests/test_inventory_v3_protocol_v2_package_tree.py
          tests/test_inventory_v3_protocol_v2_lock_shadows.py
      - name: Full repository regression except expected provenance rejections
        working-directory: target
        run: >-
          python -m pytest -q
          -k "not test_capture_build_has_canonical_empty_prelock_authorization
          and not test_docs_only_descendant_keeps_locked_protocol_evaluable
          and not test_approval_registry_only_descendant_keeps_protocol_lock_verifiable
          and not test_tests_only_descendant_keeps_locked_protocol_evaluable"
      - name: Prove frozen provenance guards reject utility descendant
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_inventory_positive_v3_independent_capture.py::test_capture_build_has_canonical_empty_prelock_authorization \
            tests/test_inventory_positive_v3_protocol_lock.py::test_docs_only_descendant_keeps_locked_protocol_evaluable \
            tests/test_inventory_positive_v3_protocol_lock.py::test_approval_registry_only_descendant_keeps_protocol_lock_verifiable \
            tests/test_inventory_positive_v3_protocol_lock.py::test_tests_only_descendant_keeps_locked_protocol_evaluable \
            > /tmp/c8a-expected-provenance-rejections.txt 2>&1
          status=$?
          set -e
          cat /tmp/c8a-expected-provenance-rejections.txt
          test "$status" -ne 0
          grep -F 'source-owned executable paths changed after the approved capture build' /tmp/c8a-expected-provenance-rejections.txt
          grep -F 'source-owned executable paths changed after the protocol source commit' /tmp/c8a-expected-provenance-rejections.txt
          grep -F 'FAILED tests/test_inventory_positive_v3_independent_capture.py::test_capture_build_has_canonical_empty_prelock_authorization' /tmp/c8a-expected-provenance-rejections.txt
          grep -F 'FAILED tests/test_inventory_positive_v3_protocol_lock.py::test_docs_only_descendant_keeps_locked_protocol_evaluable' /tmp/c8a-expected-provenance-rejections.txt
          grep -F 'FAILED tests/test_inventory_positive_v3_protocol_lock.py::test_approval_registry_only_descendant_keeps_protocol_lock_verifiable' /tmp/c8a-expected-provenance-rejections.txt
          grep -F 'FAILED tests/test_inventory_positive_v3_protocol_lock.py::test_tests_only_descendant_keeps_locked_protocol_evaluable' /tmp/c8a-expected-provenance-rejections.txt
      - name: Verify proposal-prep checkout stayed clean
        working-directory: target
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
