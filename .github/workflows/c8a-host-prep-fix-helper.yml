name: C8A host prep fix helper

on:
  push:
    branches:
      - chatgpt/c8a-host-prep-fix-helper

permissions:
  contents: write

jobs:
  repair-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c8a-inventory-live-authorization
          path: frozen-c8a
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c8a-windows-authorization-proposal-prep
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen C8A branch remains exact L2 and untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-c8a rev-parse HEAD)" = "66c7e9536539979bc60e17f02f026eb64ebf0768"
          test -z "$(git -C frozen-c8a status --porcelain=v1 --untracked-files=all)"
      - name: Install
        working-directory: target
        run: python -m pip install -e '.[dev]'
      - name: Deterministic Ruff repair
        working-directory: target
        run: |
          ruff check --fix tests/test_inventory_v3_protocol_v2_authorization_host_prep.py
          ruff format tests/test_inventory_v3_protocol_v2_authorization_host_prep.py
      - name: Ruff
        working-directory: target
        run: ruff check .
      - name: Strict Linux mypy
        working-directory: target
        run: mypy --strict --platform linux src
      - name: Focused C8A host prep and protocol tests
        working-directory: target
        run: >-
          python -m pytest -q
          tests/test_inventory_v3_protocol_v2_authorization_host_prep.py
          tests/test_inventory_v3_protocol_v2_protocol.py
          tests/test_inventory_v3_protocol_v2_repository.py
      - name: Full repository pytest
        working-directory: target
        run: python -m pytest -q
      - name: Commit repaired prep test only
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_inventory_v3_protocol_v2_authorization_host_prep.py
          if git diff --cached --quiet; then
            echo 'No formatting repair required.'
            exit 0
          fi
          git commit -m 'test(inventory): format C8A host proposal contract'
          git push origin HEAD:chatgpt/c8a-windows-authorization-proposal-prep
