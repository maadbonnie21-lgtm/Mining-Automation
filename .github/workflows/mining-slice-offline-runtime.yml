name: Mining slice offline runtime

on:
  push:
    branches:
      - chatgpt/mining-slice-offline-runtime

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mining-slice-offline-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed mining slice implementation
        shell: python
        run: |
          import base64
          import zlib
          from pathlib import Path

          files = {
              "src/mining_automation/mining_slice.py": "",
              "tests/test_mining_slice.py": "",
          }
          for path, payload in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(zlib.decompress(base64.b64decode(payload)))
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Strict mypy
        run: mypy --strict --platform linux src
      - name: Focused mining slice tests
        run: >-
          python -m pytest -q
          tests/test_mining_slice.py
          tests/test_controller.py
          tests/test_constrained_v1_same_cycle.py
          tests/test_constrained_v1_perception_authority.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Commit validated offline runtime
        shell: bash
        run: |
          rm -f .github/workflows/mining-slice-offline-runtime.yml .github/mining-slice-runtime-trigger
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mining): add atomic one-attempt mining-only runtime'
          git push origin HEAD:chatgpt/mining-slice-offline-runtime
