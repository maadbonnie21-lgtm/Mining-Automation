name: RuneLite PREP autofix

on:
  push:
    branches:
      - chatgpt/runelite-prep-ready-2026-09-04
    paths:
      - .github/workflows/runelite-prep-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runelite-prep-ready-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply narrow source repair
        run: python .github/prep_autofix.py
      - name: Apply focused Ruff fixes
        run: ruff check --fix src/mining_automation/validation/runelite_prep.py src/mining_automation/validation/_runelite_prep_win32.py tools/runelite_prep.py tests/test_runelite_prep.py
      - name: Verify Ruff
        run: ruff check .
      - name: Verify PREP typing
        run: mypy --strict src/mining_automation/validation/runelite_prep.py src/mining_automation/validation/_runelite_prep_win32.py
      - name: Verify focused PREP and Windows safety tests
        run: python -m pytest -q tests/test_runelite_prep.py tests/test_windows_camera_nonactivating.py tests/test_windows_capture.py
      - name: Verify mining-to-full read-only plan
        run: python tools/run_mining_to_full.py
      - name: Commit verified repair and remove helper files
        run: |
          rm .github/workflows/runelite-prep-autofix.yml .github/prep_autofix.py
          git config user.name crusader-row-command-center
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(prep): make PREP path lint and type clean'
          git push origin HEAD:chatgpt/runelite-prep-ready-2026-09-04
