name: B4 finalize integration

on:
  push:
    branches:
      - chatgpt/b4-navigation-writer-integration

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/b4-navigation-writer-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply reviewed repair and stronger-error migration
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/windows-navigation-handle-writer.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          step_index = lines.index('      - name: Apply deterministic B2/B3 compatibility repair')
          run_index = lines.index('        run: |', step_index)
          script_lines: list[str] = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded repair indentation: {line!r}')
              script_lines.append(line[10:])
          if not script_lines:
              raise SystemExit('embedded B4 repair script is empty')
          exec(compile('\n'.join(script_lines), str(workflow_path), 'exec'), {})

          test_path = Path('tests/test_navigation_release_decision.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = '        match="changed between repeated intake snapshots",\n'
          new = '        match="durable acquisition physical identity differs",\n'
          if old not in test_text:
              raise SystemExit('missing stronger physical-identity error migration anchor')
          test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text, encoding='utf-8')

          Path('.github/workflows/b4-finalize-integration.yml').unlink()
      - name: Ruff
        run: ruff check .
      - name: Strict Linux mypy
        run: mypy --strict --platform linux src
      - name: Focused B4 durable and release tests
        run: python -m pytest -q tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
      - name: All navigation tests
        run: python -m pytest -q tests/test_navigation*.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Commit corrected integration
        shell: bash
        run: |
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows src/mining_automation/navigation/durable_route_evidence.py tests/test_navigation_release_decision.py
          git commit -m 'fix(navigation): integrate B2 release detail with B3 physical identity'
          git push origin HEAD:chatgpt/b4-navigation-writer-integration
