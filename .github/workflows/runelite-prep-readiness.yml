name: RuneLite PREP to READY

on:
  push:
    branches:
      - chatgpt/runelite-prep-ready-2026-09-04
  pull_request:
    paths:
      - src/mining_automation/validation/runelite_prep.py
      - src/mining_automation/validation/_runelite_prep_win32.py
      - tools/runelite_prep.py
      - tests/test_runelite_prep.py
      - .github/workflows/runelite-prep-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runelite-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Ruff PREP path
        run: >-
          ruff check
          src/mining_automation/validation/runelite_prep.py
          src/mining_automation/validation/_runelite_prep_win32.py
          tools/runelite_prep.py
          tests/test_runelite_prep.py
      - name: Strict mypy PREP source
        run: >-
          mypy --strict
          src/mining_automation/validation/runelite_prep.py
          src/mining_automation/validation/_runelite_prep_win32.py
      - name: Focused PREP and existing Windows safety tests
        run: >-
          python -m pytest -q
          tests/test_runelite_prep.py
          tests/test_windows_camera_nonactivating.py
          tests/test_windows_capture.py
      - name: Mining-to-full read-only plan remains unchanged
        shell: python
        run: |
          import json
          import subprocess
          import sys

          completed = subprocess.run(
              [sys.executable, "tools/run_mining_to_full.py"],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(completed.stdout)
          assert plan["mode"] == "read_only_plan"
          assert plan["live_input_performed"] is False
          assert plan["required_geometry"] == [1005, 1078]
          assert plan["required_dpi"] == 96
          assert plan["resource_threshold"] == 0.12
          assert plan["resource_landmarks"] == 6
          assert plan["resource_quorum"] == 5
          assert plan["resource_zones_required"] == 3
          assert plan["inventory_floor"] == 0.8
          assert plan["inventory_capacity"] == 28
          assert plan["maximum_clicks_per_attempt"] == 1
          assert plan["navigation_started_on_full"] is False
