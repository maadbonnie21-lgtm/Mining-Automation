name: Mining loop 28 offline readiness

on:
  push:
    branches:
      - chatgpt/mining-loop-28-ready-2026-09-04
  pull_request:
    paths:
      - src/mining_automation/mining_loop_runtime.py
      - src/mining_automation/mining_full_proof.py
      - src/mining_automation/controlled_mining_runner.py
      - tests/test_inventory_empty_hash_not_occupied.py
      - tests/test_retained_iron_inventory.py
      - tests/fixtures/retained_iron_inventory_regions.json
      - src/mining_automation/perception/inventory/retained_iron.py
      - tests/test_mining_loop_runtime.py
      - tests/test_mining_full_proof.py
      - tests/test_live_mining_evidence_contract.py
      - tools/run_mining_to_full.py
      - tools/validate_mining_to_full_result.py
      - docs/MINING_LIVE_LOOP_AUDIT_2026-09-04.md
      - docs/MINING_TO_FULL_RUNBOOK_2026-09-04.md
      - .github/workflows/mining-loop-28-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mining-loop-28-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused mining path
        run: >-
          ruff check
          src/mining_automation/perception/inventory/retained_iron.py
          src/mining_automation/mining_loop_runtime.py
          src/mining_automation/mining_full_proof.py
          tests/test_mining_loop_runtime.py
          tests/test_mining_full_proof.py
          tests/test_inventory_empty_hash_not_occupied.py
          tests/test_retained_iron_inventory.py
          tests/test_live_mining_evidence_contract.py
          tools/run_mining_to_full.py
          tools/validate_mining_to_full_result.py
      - name: Strict mypy repeated runtime and proof validator
        run: >-
          mypy --strict
          src/mining_automation/mining_loop_runtime.py
          src/mining_automation/mining_full_proof.py
      - name: Focused mining, real-evidence, and Windows safety tests
        run: >-
          python -m pytest -q
          tests/test_mining_loop_runtime.py
          tests/test_mining_full_proof.py
          tests/test_live_mining_evidence_contract.py
          tests/test_mining_slice.py
          tests/test_mining_slice_endurance.py
          tests/test_controlled_mining_runner.py
          tests/test_inventory_empty_hash_not_occupied.py
          tests/test_retained_iron_inventory.py
          tests/test_windows_camera_nonactivating.py
      - name: Read-only full-run plan check
        shell: python
        run: |
          import json
          import subprocess
          import sys

          completed = subprocess.run(
              [sys.executable, "tools/run_mining_to_full.py"],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(completed.stdout)
          assert plan["mode"] == "read_only_plan"
          assert plan["live_input_performed"] is False
          assert plan["required_geometry"] == [1005, 1078]
          assert plan["required_dpi"] == 96
          assert plan["resource_threshold"] == 0.12
          assert plan["resource_landmarks"] == 6
          assert plan["resource_quorum"] == 5
          assert plan["resource_zones_required"] == 3
          assert plan["inventory_floor"] == 0.8
          assert plan["inventory_capacity"] == 28
          assert plan["maximum_clicks_per_attempt"] == 1
          assert plan["navigation_started_on_full"] is False

  full-linux:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Full repository tests at integration checkpoint
        run: python -m pytest -q
