name: Mining full-proof mypy repair

on:
  push:
    branches:
      - chatgpt/mining-loop-28-ready-2026-09-04
    paths:
      - .github/workflows/mining-full-proof-mypy-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mining-loop-28-ready-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair exact Sequence narrowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mining_automation/mining_full_proof.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _sequence(value: object, label: str) -> Sequence[object]:
    if type(value) not in {list, tuple}:
        raise MiningFullProofError(f"{label} must be an exact list or tuple")
    return value
'''
          new = '''def _sequence(value: object, label: str) -> Sequence[object]:
    if not isinstance(value, (list, tuple)):
        raise MiningFullProofError(f"{label} must be an exact list or tuple")
    return value
'''
          if old not in text:
              raise SystemExit('Sequence narrowing anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          mypy src
          python -m pytest -q tests/test_mining_full_proof.py
      - name: Commit and remove helper
        run: |
          rm .github/workflows/mining-full-proof-mypy-repair.yml
          git config user.name crusader-row-execution-lead
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(mining): narrow proof evidence sequences safely'
          git push origin HEAD:chatgpt/mining-loop-28-ready-2026-09-04
