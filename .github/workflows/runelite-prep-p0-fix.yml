name: RuneLite PREP P0 adversarial fix

on:
  push:
    branches:
      - chatgpt/runelite-prep-ready-2026-09-04
    paths:
      - .github/workflows/runelite-prep-p0-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runelite-prep-ready-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply exact P0 patch
        run: python .github/prep_p0_fix.py
      - name: Apply focused Ruff fixes
        run: >-
          ruff check --fix
          src/mining_automation/validation/runelite_prep.py
          src/mining_automation/validation/_runelite_prep_win32.py
          tools/runelite_prep.py
          tests/test_runelite_prep.py
      - name: Verify Ruff
        run: ruff check .
      - name: Verify strict PREP typing
        run: >-
          mypy --strict
          src/mining_automation/validation/runelite_prep.py
          src/mining_automation/validation/_runelite_prep_win32.py
      - name: Verify focused PREP and camera safety
        run: >-
          python -m pytest -q
          tests/test_runelite_prep.py
          tests/test_windows_camera_nonactivating.py
      - name: Verify legacy capture contracts on intended off-Windows harness
        run: python -m pytest -q tests/test_windows_capture.py
      - name: Verify mining-to-full plan remains unchanged
        shell: python
        run: |
          import json
          import subprocess
          import sys

          completed = subprocess.run(
              [sys.executable, "tools/run_mining_to_full.py"],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(completed.stdout)
          assert plan["mode"] == "read_only_plan"
          assert plan["live_input_performed"] is False
          assert plan["required_geometry"] == [1005, 1078]
          assert plan["required_dpi"] == 96
          assert plan["resource_threshold"] == 0.12
          assert plan["resource_landmarks"] == 6
          assert plan["resource_quorum"] == 5
          assert plan["resource_zones_required"] == 3
          assert plan["inventory_floor"] == 0.8
          assert plan["inventory_capacity"] == 28
          assert plan["maximum_clicks_per_attempt"] == 1
          assert plan["navigation_started_on_full"] is False
      - name: Commit verified P0 fix and remove helper files
        run: |
          rm .github/workflows/runelite-prep-p0-fix.yml .github/prep_p0_fix.py
          git config user.name crusader-row-command-center
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(prep): harden READY gate and clean mining handoff'
          git push origin HEAD:chatgpt/runelite-prep-ready-2026-09-04
