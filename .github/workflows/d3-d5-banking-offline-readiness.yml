name: Banking D3-D5 offline readiness

on:
  push:
    branches:
      - chatgpt/d3-d5-banking-offline-readiness

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/d3-d5-banking-offline-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed D3-D5 implementation
        shell: python
        run: |
          import base64
          import zlib
          from pathlib import Path

          files = {
              'src/mining_automation/banking/passive_campaign.py': '',
              'src/mining_automation/banking/endurance_rehearsal.py': '',
              'src/mining_automation/banking/integration_boundary.py': '',
              'src/mining_automation/banking/__init__.py': '',
              'tests/test_banking_passive_campaign.py': '',
              'tests/test_banking_endurance_rehearsal.py': '',
              'tests/test_banking_integration_readiness.py': '',
              'tests/test_banking_integration_boundary.py': '',
          }
          for path, payload in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(zlib.decompress(base64.b64decode(payload)))
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Strict mypy
        run: mypy --strict --platform linux src
      - name: Focused banking tests
        run: python -m pytest -q tests/test_banking*.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Commit validated banking readiness
        shell: bash
        run: |
          rm -f .github/workflows/d3-d5-banking-offline-readiness.yml
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(banking): add passive evidence endurance and endpoint readiness'
          git push origin HEAD:chatgpt/d3-d5-banking-offline-readiness
