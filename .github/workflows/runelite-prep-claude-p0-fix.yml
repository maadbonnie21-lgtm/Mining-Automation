name: RuneLite PREP Claude P0 fix

on:
  push:
    branches:
      - chatgpt/runelite-prep-ready-2026-09-04
    paths:
      - .github/prep_claude_p0_fix.py
      - .github/workflows/runelite-prep-claude-p0-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runelite-prep-ready-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply Claude P0 patch
        run: python .github/prep_claude_p0_fix.py
      - name: Focused Ruff fixes
        run: >-
          ruff check --fix
          src/mining_automation/validation/runelite_prep.py
          tools/runelite_prep.py
          tools/run_mining_to_full.py
          tests/test_runelite_prep.py
          tests/test_mining_to_full_p0_preflight.py
      - name: Verify Ruff
        run: ruff check .
      - name: Verify strict PREP typing
        run: >-
          mypy --strict
          src/mining_automation/validation/runelite_prep.py
          src/mining_automation/validation/_runelite_prep_win32.py
      - name: Verify focused PREP and P0 miner preflight
        run: >-
          python -m pytest -q
          tests/test_runelite_prep.py
          tests/test_mining_to_full_p0_preflight.py
          tests/test_windows_camera_nonactivating.py
      - name: Verify mining plan stays fail closed
        shell: python
        run: |
          import json
          import subprocess
          import sys
          completed = subprocess.run(
              [sys.executable, 'tools/run_mining_to_full.py'],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(completed.stdout)
          assert plan['mode'] == 'read_only_plan'
          assert plan['live_input_performed'] is False
          assert plan['required_geometry'] == [1005, 1078]
          assert plan['required_dpi'] == 96
          assert plan['resource_threshold'] == 0.12
          assert plan['resource_landmarks'] == 6
          assert plan['resource_quorum'] == 5
          assert plan['resource_zones_required'] == 3
          assert plan['inventory_floor'] == 0.8
          assert plan['inventory_capacity'] == 28
          assert plan['maximum_clicks_per_attempt'] == 1
          assert plan['navigation_started_on_full'] is False
          assert plan['local_pose_references_required'] == 3
          assert plan['tracked_checkout_required_clean'] is True
          assert plan['untracked_private_pose_references_permitted'] is True
          assert plan['camera_preparation_authority'] is False
      - name: Commit verified P0 fixes and remove helper files
        run: |
          rm .github/workflows/runelite-prep-claude-p0-fix.yml .github/prep_claude_p0_fix.py
          git config user.name crusader-row-command-center
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(prep): remove live-run deadlock and disable unproven camera search'
          git push origin HEAD:chatgpt/runelite-prep-ready-2026-09-04
