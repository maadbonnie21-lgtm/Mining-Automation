name: Lead B4 final validation

on:
  push:
    branches: [chatgpt/lead-b4-final-validation]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/b4-navigation-writer-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact B4 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0f89a1b21f65e41e9c07c156b795ea137545802b"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Strict Linux mypy
        run: mypy --strict --platform linux src
      - name: Focused navigation
        run: >-
          python -m pytest -q
          tests/test_navigation_release_decision.py
          tests/test_navigation_durable_route_evidence.py
          tests/test_navigation_causality.py
          tests/test_navigation_passive_campaign.py
      - name: Full repository pytest
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/b4-navigation-writer-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact B4 head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '0f89a1b21f65e41e9c07c156b795ea137545802b') { throw 'wrong B4 head' }
          if ((git status --porcelain=v1 --untracked-files=all) -ne $null) { throw 'dirty B4 checkout' }
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/mining_automation/navigation tests/test_navigation_durable_route_evidence.py tests/test_navigation_release_decision.py
      - name: Strict Windows navigation mypy
        run: >-
          mypy --strict --platform win32
          src/mining_automation/navigation/_windows_handle_anchored.py
          src/mining_automation/navigation/handle_anchored_route_evidence.py
          src/mining_automation/navigation/durable_route_evidence.py
      - name: Native Windows navigation matrix
        run: >-
          python -m pytest -q
          tests/test_navigation_durable_route_evidence.py
          tests/test_navigation_release_decision.py
