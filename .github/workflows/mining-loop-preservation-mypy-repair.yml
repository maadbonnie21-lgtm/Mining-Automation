name: Mining loop preservation mypy repair

on:
  push:
    branches:
      - chatgpt/mining-loop-28-ready-2026-09-04
    paths:
      - .github/workflows/mining-loop-preservation-mypy-repair.yml

permissions:
  contents: write

concurrency:
  group: mining-loop-preservation-mypy-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mining-loop-28-ready-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact type-only repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/mining_automation/controlled_mining_runner.py')
          text = path.read_text(encoding='utf-8')
          old = '        self._dispatched = False\n'
          new = '        self._dispatched: bool = False\n'
          if old not in text:
              raise SystemExit('live dispatcher state anchor missing')
          text = text.replace(old, new, 1)

          old_import = '''        from .perception.inventory.positive_classifier_v3 import (
              SUPPORTED_COLUMN_STRIDE,
              SUPPORTED_FRAME_HEIGHT,
              SUPPORTED_FRAME_WIDTH,
              SUPPORTED_PROFILE_ID,
              SUPPORTED_REGION,
              SUPPORTED_ROW_STRIDE,
              InventoryPositiveV3DevelopmentAnalyzer,
          )
'''
          new_import = '''        from .perception.inventory.positive_classifier_v3 import (
              InventoryPositiveV3DevelopmentAnalyzer,
          )
          from .perception.inventory.positive_v3_prototypes import (
              SUPPORTED_COLUMN_STRIDE,
              SUPPORTED_FRAME_HEIGHT,
              SUPPORTED_FRAME_WIDTH,
              SUPPORTED_PROFILE_ID,
              SUPPORTED_REGION,
              SUPPORTED_ROW_STRIDE,
          )
'''
          if old_import not in text:
              raise SystemExit('Inventory V3 import anchor missing')
          text = text.replace(old_import, new_import, 1)
          path.write_text(text, encoding='utf-8')
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Format and verify
        run: |
          ruff check --fix src/mining_automation/controlled_mining_runner.py
          ruff check .
          mypy src
      - name: Remove one-shot repair workflow
        run: rm .github/workflows/mining-loop-preservation-mypy-repair.yml
      - name: Commit type-only repair
        run: |
          git config user.name crusader-row-execution-lead
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(mining): make preserved live runner type-clean'
          git push origin HEAD:chatgpt/mining-loop-28-ready-2026-09-04
