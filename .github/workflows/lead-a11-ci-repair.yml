name: Lead A11 CI repair

on:
  push:
    branches: [chatgpt/lead-a11-ci-repair]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/a11-resource-live-enable-only
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch historical test projections only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "80a3937177226437d98e1dea67a54e43f6dde091"
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_resource_release_live_readiness.py')
          s = p.read_text()
          old = '''@pytest.fixture(autouse=True)\ndef _fixed_test_lineage(monkeypatch: pytest.MonkeyPatch) -> None:\n    monkeypatch.setattr(\n        readiness,\n'''
          new = '''@pytest.fixture(autouse=True)\ndef _fixed_test_lineage(monkeypatch: pytest.MonkeyPatch) -> None:\n    monkeypatch.setattr(campaign, "LIVE_RESOURCE_CAMPAIGN_AUTHORIZED", False)\n    enabled_sha = hashlib.sha256(\n        Path(campaign.__file__).resolve(strict=True).read_bytes()\n    ).hexdigest()\n    monkeypatch.setattr(readiness, "_EXPECTED_CAMPAIGN_SOURCE_SHA256", enabled_sha)\n    monkeypatch.setattr(\n        readiness,\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          start = s.index('def test_a11_enabled_head_changes_only_live_gate_and_preserves_safety() -> None:')
          end = s.index('\ndef test_preparation_never_constructs_session_or_capture_backend(', start)
          replacement = '''def test_a11_enabled_head_changes_only_live_gate_and_preserves_safety(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    monkeypatch.setattr(campaign, "LIVE_RESOURCE_CAMPAIGN_AUTHORIZED", True)\n    source_path = Path(campaign.__file__).resolve(strict=True)\n    current_source = source_path.read_text(encoding="utf-8")\n    old_gate = "LIVE_RESOURCE_CAMPAIGN_AUTHORIZED: Final[bool] = False"\n    new_gate = "LIVE_RESOURCE_CAMPAIGN_AUTHORIZED: Final[bool] = True"\n    assert current_source.count(new_gate) == 1\n    assert old_gate not in current_source\n    assert campaign.LIVE_RESOURCE_CAMPAIGN_AUTHORIZED is True\n\n    profile = readiness.load_varrock_east_iron_profile()\n    assert {item.maximum_distance for item in profile.scene_landmarks} == {0.12}\n    assert len(profile.scene_landmarks) == 6\n    assert profile.minimum_landmark_quorum == 5\n    assert profile.minimum_landmark_zones == 3\n    assert len(\n        {\n            item.zone(profile.frame_width, profile.frame_height).value\n            for item in profile.scene_landmarks\n        }\n    ) == 3\n    assert profile.frame_width == 1005\n    assert profile.frame_height == 1078\n    assert profile.pixel_format.value == "bgra8888"\n    assert campaign._REQUIRED_REPORTED_DPI == 96\n    assert len(campaign.CAMPAIGN_PLAN) == 15\n    config = campaign._capture_configuration()\n    assert config["retry_attempts"] == 0\n    assert config["automatic_camera_control"] is False\n    assert config["automatic_camera_recovery"] is False\n    assert config["input_allowed"] is False\n    assert all(value is False for value in readiness._authority().values())\n\n'''
          s = s[:start] + replacement + s[end+1:]

          old_binding = '''    assert campaign_binding == {\n        "path": readiness._CAMPAIGN_SOURCE_PATH,\n        "git_blob_sha": "8dda986b902475093af36aad043a8c747cbfeb7f",\n        "sha256": (\n            "8e791f582af8ba3f5c19e60b951114b451d76fcd321cb6ff809f77bac828c83a"\n        ),\n    }\n'''
          new_binding = '''    assert campaign_binding == {\n        "path": readiness._CAMPAIGN_SOURCE_PATH,\n        "git_blob_sha": "0a68a8cd346a0b2482dbdbb864d02284a04ef9b7",\n        "sha256": (\n            "50649a0195e2dea8e9dac645689dd4274efeea4c3ef80eaebbe40b271072aafd"\n        ),\n    }\n'''
          assert s.count(old_binding) == 1
          s = s.replace(old_binding, new_binding, 1)
          p.write_text(s)

          p = Path('tests/test_resource_release_campaign.py')
          s = p.read_text()
          old = '''def test_capture_configuration_source_owns_pending_dpi_requirement(\n    tmp_path: Path,\n) -> None:\n    session = _session(tmp_path)\n'''
          new = '''def test_capture_configuration_source_owns_pending_dpi_requirement(\n    monkeypatch: pytest.MonkeyPatch,\n    tmp_path: Path,\n) -> None:\n    monkeypatch.setattr(campaign, "LIVE_RESOURCE_CAMPAIGN_AUTHORIZED", False)\n    session = _session(tmp_path)\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''def test_live_source_gate_blocks_before_capture_or_case_directory(\n    tmp_path: Path,\n) -> None:\n    session = _session(tmp_path)\n'''
          new = '''def test_live_source_gate_blocks_before_capture_or_case_directory(\n    monkeypatch: pytest.MonkeyPatch,\n    tmp_path: Path,\n) -> None:\n    monkeypatch.setattr(campaign, "LIVE_RESOURCE_CAMPAIGN_AUTHORIZED", False)\n    session = _session(tmp_path)\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Validate focused A11 suite and exact production diff
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff check tests/test_resource_release_campaign.py tests/test_resource_release_live_readiness.py src/mining_automation/perception/resource_release_campaign.py
          mypy src
          pytest tests/test_resource_release_campaign.py tests/test_resource_release_live_readiness.py -q
          git diff --unified=0 0d215457fb4b037eedc74cb776a3cf1f5f58a19f -- src/mining_automation/perception/resource_release_campaign.py > /tmp/prod.diff
          grep -F -- '-LIVE_RESOURCE_CAMPAIGN_AUTHORIZED: Final[bool] = False' /tmp/prod.diff
          grep -F -- '+LIVE_RESOURCE_CAMPAIGN_AUTHORIZED: Final[bool] = True' /tmp/prod.diff
          test "$(grep -Ec '^[+-][^+-]' /tmp/prod.diff)" -eq 2
          names="$(git diff --name-only 0d215457fb4b037eedc74cb776a3cf1f5f58a19f | sort)"
          expected="$(printf '%s\n' src/mining_automation/perception/resource_release_campaign.py tests/test_resource_release_campaign.py tests/test_resource_release_live_readiness.py | sort)"
          test "$names" = "$expected"
      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mining Automation Lead'
          git config user.email 'lead@users.noreply.github.com'
          git add tests/test_resource_release_campaign.py tests/test_resource_release_live_readiness.py
          git commit -m 'test(resource): preserve pre-enable contracts after A11 gate flip'
          git push origin HEAD:chatgpt/a11-resource-live-enable-only
