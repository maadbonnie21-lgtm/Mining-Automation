name: Mining-only atomic loop helper

on:
  push:
    branches:
      - chatgpt/m-mining-only-loop-helper

permissions:
  contents: write

jobs:
  build-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/m-mining-only-atomic-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed mining-only source and tests
        shell: python
        env:
          SOURCE_GZIP_BASE64: 
          TEST_GZIP_BASE64: 
        run: |
          import base64
          import gzip
          import os
          from pathlib import Path

          source = gzip.decompress(base64.b64decode(os.environ["SOURCE_GZIP_BASE64"]))
          tests = gzip.decompress(base64.b64decode(os.environ["TEST_GZIP_BASE64"]))
          source_path = Path("src/mining_automation/mining_slice.py")
          test_path = Path("tests/test_mining_slice.py")
          source_path.write_bytes(source)
          test_path.write_bytes(tests)
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/mining_automation/mining_slice.py tests/test_mining_slice.py
      - name: Strict mypy
        run: mypy --strict src
      - name: Focused mining-only tests
        run: python -m pytest -q tests/test_mining_slice.py tests/test_controller.py
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Commit exact source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'crusader-row-command-center'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mining_automation/mining_slice.py tests/test_mining_slice.py
          git commit -m 'feat(mining): add atomic one-attempt mining-only loop'
          git push origin HEAD:chatgpt/m-mining-only-atomic-loop
