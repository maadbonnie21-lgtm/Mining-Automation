name: A11 exact-head validation

on:
  push:
    branches: ["chatgpt/a11-execution-helper"]

permissions:
  contents: read

jobs:
  validate-exact-a11-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 319db654e62dcc17c634e464404810a61d205ec0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reviewed head and ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "319db654e62dcc17c634e464404810a61d205ec0"
          test "$(git rev-parse HEAD^)" = "80a3937177226437d98e1dea67a54e43f6dde091"
          test "$(git rev-parse HEAD^^)" = "0d215457fb4b037eedc74cb776a3cf1f5f58a19f"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Strict mypy
        run: mypy --strict --platform linux src
      - name: Focused Resource release validation
        run: >-
          python -m pytest -q
          tests/test_resource_release_campaign.py
          tests/test_resource_release_live_readiness.py
          tests/test_resource_release_decision.py
          tests/test_resource_release_receipt.py
          tests/test_resource_same_cycle.py
      - name: Full repository pytest
        run: python -m pytest -q
