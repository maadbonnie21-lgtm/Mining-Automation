name: Mining proof fix

on:
  push:
    branches:
      - chatgpt/mining-loop-28-ready-2026-09-04
    paths:
      - .github/workflows/mining-proof-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mining-loop-28-ready-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source
        run: >-
          python -c "from pathlib import Path;
          p=Path('src/mining_automation/mining_full_proof.py');
          s=p.read_text(encoding='utf-8');
          old='    if type(value) not in {list, tuple}:\\n';
          new='    if not isinstance(value, (list, tuple)):\\n';
          assert s.count(old)==1, s.count(old);
          p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Verify
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          mypy src
          python -m pytest -q tests/test_mining_full_proof.py
      - name: Commit
        run: |
          rm -f .github/workflows/mining-full-proof-mypy-repair.yml
          rm -f .github/workflows/mining-proof-fix.yml
          git config user.name crusader-row-execution-lead
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix(mining): narrow proof evidence sequences safely'
          git push origin HEAD:chatgpt/mining-loop-28-ready-2026-09-04
