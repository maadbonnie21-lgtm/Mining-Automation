name: P0 PREP exact-HWND live boundary

on:
  push:
    branches:
      - chatgpt/p0-prep-owner-fix-2026-09-05
  pull_request:
    paths:
      - src/mining_automation/validation/runelite_prep_live_boundary.py
      - tools/runelite_prep_live.py
      - tools/run_28_auto.py
      - tools/run_mining_to_full_safe.py
      - tests/test_runelite_prep_live_boundary.py
      - tests/test_run_28_auto.py
      - tests/test_run_mining_to_full_safe.py
      - .github/workflows/p0-prep-live-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-prep-live-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Ruff first-live PREP/mining boundary
        id: ruff
        continue-on-error: true
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          command = [
              "ruff",
              "check",
              "src/mining_automation/validation/runelite_prep_live_boundary.py",
              "tools/runelite_prep_live.py",
              "tools/run_28_auto.py",
              "tools/run_mining_to_full_safe.py",
              "tests/test_runelite_prep_live_boundary.py",
              "tests/test_run_28_auto.py",
              "tests/test_run_mining_to_full_safe.py",
          ]
          completed = subprocess.run(command, capture_output=True, text=True)
          output = completed.stdout + completed.stderr
          Path("ruff-output.txt").write_text(output, encoding="utf-8")
          print(output, end="")
          raise SystemExit(completed.returncode)
      - name: Upload exact Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.os }}
          path: ruff-output.txt
          if-no-files-found: error
      - name: Enforce Ruff result
        if: steps.ruff.outcome == 'failure'
        shell: python
        run: raise SystemExit("Ruff failed; see the uploaded exact diagnostics artifact")
      - name: Strict mypy first-live PREP source
        run: >-
          mypy --strict
          src/mining_automation/validation/runelite_prep_live_boundary.py
      - name: Exact-HWND READY and separate-mining regressions
        run: >-
          python -m pytest -q
          tests/test_runelite_prep_live_boundary.py
          tests/test_runelite_prep.py
          tests/test_runelite_prep_focus_resize_regression.py
          tests/test_runelite_prep_fresh_diagnostics_regression.py
          tests/test_run_28_auto.py
          tests/test_run_mining_to_full_safe.py
      - name: PREP cannot manufacture mining authority
        shell: python
        run: |
          from pathlib import Path

          live_prep = Path("tools/runelite_prep_live.py").read_text(encoding="utf-8")
          prep_to_ready = Path("tools/run_28_auto.py").read_text(encoding="utf-8")
          safe_mining = Path("tools/run_mining_to_full_safe.py").read_text(encoding="utf-8")

          assert "run_mining_to_full" not in live_prep
          assert "dispatch_one_click" not in live_prep
          assert "camera_steps=()" in live_prep
          assert "separate mining-only authorization" in live_prep.lower()

          assert "mining.main(" not in prep_to_ready
          assert "prep_auto" not in prep_to_ready
          assert "prep_live.main(" in prep_to_ready
          assert "run_mining_to_full_safe.py" in prep_to_ready
          assert "AUTO_PREP_TO_READY_ONLY" in prep_to_ready

          assert "runelite_prep" not in safe_mining
          assert "mining.main(" in safe_mining
          assert "_, final_window = self._verify_window()" in safe_mining
      - name: Mining-to-full read-only plan unchanged
        shell: python
        run: |
          import json
          import subprocess
          import sys

          completed = subprocess.run(
              [sys.executable, "tools/run_mining_to_full.py"],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(completed.stdout)
          assert plan["mode"] == "read_only_plan"
          assert plan["live_input_performed"] is False
          assert plan["required_geometry"] == [1005, 1078]
          assert plan["required_dpi"] == 96
          assert plan["resource_threshold"] == 0.12
          assert plan["resource_quorum"] == 5
          assert plan["resource_zones_required"] == 3
          assert plan["inventory_floor"] == 0.8
          assert plan["maximum_clicks_per_attempt"] == 1
          assert plan["navigation_started_on_full"] is False
