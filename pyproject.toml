[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-automation"
version = "0.1.0.dev0"
description = "Vision-driven autonomous mining desktop application"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mining Automation Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
mining-automation = "mining_automation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mining_automation"]
