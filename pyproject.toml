[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-automation"
version = "0.1.0.dev0"
description = "Vision-driven autonomous mining desktop application"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mining Automation Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest~=9.1.1",
  "pytest-cov~=7.1.0",
  "ruff~=0.16.3",
  "mypy~=2.3.1",
]

[project.scripts]
mining-automation = "mining_automation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mining_automation.perception" = ["profiles/*.json"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
required-version = ">=0.16.3,<0.17"
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mining_automation"]
